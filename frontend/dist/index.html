<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23ff7a2f'/%3E%3C/svg%3E"/>
  <title>SURYA-KAVACH · Aditya-L1 Flare Operations Center</title>
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./vendor/htm.umd.js"></script>
<script src="./vendor/plotly.min.js" charset="utf-8"></script>
<style>
  :root{
    --bg:#070b14; --bg2:#0b1120; --panel:#0f1626; --panel2:#141d30; --line:#1f2a40;
    --ink:#e6ecf6; --dim:#8893a7; --faint:#5a6478;
    --orange:#ff7a2f; --blue:#4aa8ff; --cyan:#34d3e0; --green:#33d18b; --red:#ff5d73;
    --yellow:#ffcf4d; --violet:#9b8cff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 600px at 80% -10%, #10203b 0%, var(--bg) 55%);
    color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:13.5px}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#22304a;border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}
  .app{display:flex;min-height:100vh}
  /* sidebar */
  .side{width:230px;background:linear-gradient(180deg,#0a1020,#070b14);border-right:1px solid var(--line);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px;border-bottom:1px solid var(--line)}
  .logo{width:34px;height:34px;border-radius:9px;background:radial-gradient(circle at 30% 30%,#ffd08a,var(--orange));
    box-shadow:0 0 18px rgba(255,122,47,.5);flex:none}
  .brand b{font-size:15px;letter-spacing:.4px;display:block}
  .brand span{font-size:10px;color:var(--dim);letter-spacing:2px}
  .nav{padding:12px 10px;flex:1;overflow:auto}
  .nav a{display:flex;align-items:center;gap:11px;padding:10px 13px;margin:2px 0;border-radius:9px;
    color:var(--dim);cursor:pointer;font-size:13.5px;font-weight:500;transition:all .12s}
  .nav a .ic{width:17px;text-align:center;opacity:.85}
  .nav a:hover{background:#121c30;color:var(--ink)}
  .nav a.on{background:linear-gradient(90deg,rgba(255,122,47,.16),rgba(255,122,47,.02));
    color:#fff;box-shadow:inset 2px 0 0 var(--orange)}
  .nav .tag{margin-left:auto;font-size:9px;background:var(--green);color:#06140d;padding:1px 6px;border-radius:6px;font-weight:700}
  .sidefoot{padding:12px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--faint)}
  /* main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between;padding:16px 26px;
    border-bottom:1px solid var(--line);background:rgba(8,12,22,.6);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    position:sticky;top:0;z-index:5}
  .top h1{font-size:18px;margin:0;font-weight:650}
  .top .sub{font-size:11.5px;color:var(--dim);margin-top:2px}
  .top .right{display:flex;align-items:center;gap:14px}
  .clock{font-family:"Consolas",monospace;font-size:13px;color:var(--cyan);text-align:right}
  .clock small{display:block;color:var(--faint);font-size:9px;letter-spacing:1.5px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;font-size:11.5px;font-weight:600;border:1px solid}
  .chip .d{width:7px;height:7px;border-radius:50%}
  .c-live{color:var(--green);border-color:rgba(51,209,139,.4);background:rgba(51,209,139,.08)}
  .c-on{color:var(--blue);border-color:rgba(74,168,255,.4);background:rgba(74,168,255,.08)}
  .c-off{color:var(--faint);border-color:#2a3550;background:#121a2b}
  .blink{animation:bk 1.6s infinite}@keyframes bk{50%{opacity:.35}}
  .content{padding:20px 26px;max-width:1640px;width:100%}
  /* cards */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:13px;margin-bottom:18px}
  .kpi{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);
    border-radius:13px;padding:14px 16px;position:relative;overflow:hidden}
  .kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--blue))}
  .kpi .l{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;font-weight:600}
  .kpi .v{font-size:27px;font-weight:750;margin-top:5px;letter-spacing:-.5px}
  .kpi .s{font-size:10.5px;color:var(--faint);margin-top:2px}
  .card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);
    border-radius:14px;padding:16px 18px;margin-bottom:18px}
  .card>h3{margin:0 0 13px;font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:9px}
  .card>h3 .t{font-size:11px;color:var(--dim);font-weight:400;margin-left:auto}
  .row{display:grid;gap:18px}
  .g-2-1{grid-template-columns:2.3fr 1fr}.g-1-1{grid-template-columns:1fr 1fr}
  @media(max-width:1100px){.g-2-1,.g-1-1{grid-template-columns:1fr}}
  /* controls */
  .ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:9px;
    padding:8px 14px;cursor:pointer;font-size:13px;font-weight:550;transition:all .12s;font-family:inherit}
  button:hover:not(:disabled){border-color:var(--blue);background:#17223a}
  button:disabled{opacity:.45;cursor:default}
  button.pri{background:linear-gradient(90deg,var(--orange),#ff9a3f);border-color:transparent;color:#160a02;font-weight:700}
  button.act{border-color:var(--blue);color:var(--blue)}
  select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-family:inherit;font-size:13px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{border:0;border-radius:0;border-right:1px solid var(--line)}.seg button:last-child{border-right:0}
  .seg button.on{background:rgba(74,168,255,.16);color:var(--blue)}
  .chart{width:100%}
  /* tables */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--dim);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
    position:sticky;top:0;background:var(--panel);cursor:pointer;-webkit-user-select:none;user-select:none}
  tbody tr:hover{background:#121b2e}
  .scroll{max-height:560px;overflow:auto;border-radius:8px}
  .pill{padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.3px}
  .p-confirmed{background:rgba(51,209,139,.16);color:var(--green)}
  .p-sxr_only{background:rgba(74,168,255,.16);color:var(--blue)}
  .p-hxr_only{background:rgba(255,122,47,.16);color:var(--orange)}
  .cls{font-weight:750}.cls-X{color:var(--red)}.cls-M{color:var(--orange)}.cls-C{color:var(--yellow)}
  .cls-B{color:var(--blue)}.cls-A{color:var(--dim)}.cls-U{color:var(--faint)}
  .alert{display:flex;gap:11px;padding:11px 12px;border-radius:10px;background:#101a2c;
    border-left:3px solid var(--orange);margin-bottom:9px}
  .alert .ic{font-size:16px}.alert .ts{color:var(--faint);font-size:11px;margin-top:3px}
  .muted{color:var(--dim)}.faint{color:var(--faint)}
  .empty{color:var(--faint);text-align:center;padding:34px;font-size:13px}
  .barwrap{height:7px;background:#16203440;border-radius:5px;overflow:hidden}
  .bar{height:100%;border-radius:5px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin-top:8px}
  .legend i{display:inline-block;width:11px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .hint{font-size:11px;color:var(--faint);margin-top:8px}
</style>
</head>
<body>
<div id="root"></div>
<script src="./app.js"></script>
</body>
</html>
