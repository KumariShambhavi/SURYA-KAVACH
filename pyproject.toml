[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarflare"
version = "1.0.0"
description = "SURYA-KAVACH — dual-channel (SoLEXS soft + HEL1OS hard X-ray) solar-flare nowcasting & forecasting from Aditya-L1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "astropy>=6.0",
    "joblib>=1.3",
    "pyarrow>=14.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
]

[project.scripts]
solarflare = "solarflare.cli:main"

[tool.setuptools.packages.find]
include = ["solarflare*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
